<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGrad)" />
  <rect width="400" height="480" fill="url(#grid)" />

  <!-- Outer Cyber Border -->
  <rect x="12" y="12" width="376" height="456" rx="16" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" />
  <circle cx="24" cy="24" r="3" fill="#00f0ff" />
  <circle cx="376" cy="24" r="3" fill="#00f0ff" />
  <circle cx="24" cy="456" r="3" fill="#00f0ff" />
  <circle cx="376" cy="456" r="3" fill="#00f0ff" />

  <!-- Hologram Scanlines -->
  <line x1="12" y1="80" x2="388" y2="80" stroke="rgba(0, 240, 255, 0.15)" stroke-dasharray="4 4" />
  <line x1="12" y1="400" x2="388" y2="400" stroke="rgba(0, 240, 255, 0.15)" stroke-dasharray="4 4" />

  <!-- Avatar Silhouette Silhouette -->
  <g transform="translate(200, 210)">
    <!-- Aura Glow -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#cyberNeon)" stroke-width="2" opacity="0.6" stroke-dasharray="6 3" />
    <circle cx="0" cy="0" r="88" fill="rgba(0, 240, 255, 0.04)" />

    <!-- Head & Shoulders Silhouette -->
    <!-- Shoulders -->
    <path d="M -85 140 C -85 75, -50 65, 0 65 C 50 65, 85 75, 85 140 Z" fill="#1b253b" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" />
    <!-- Collar / Hoodie V -->
    <path d="M -25 65 L 0 95 L 25 65 Z" fill="#0c111e" stroke="#00f0ff" stroke-width="1.5" />
    <!-- Head -->
    <ellipse cx="0" cy="15" rx="42" ry="52" fill="#202c46" stroke="rgba(0, 240, 255, 0.5)" stroke-width="2" />
    <!-- Cyber Visor / Glasses -->
    <path d="M -36 8 L 36 8 L 32 24 L -32 24 Z" fill="url(#cyberNeon)" opacity="0.9" />
    <line x1="-38" y1="16" x2="38" y2="16" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    <!-- Headset -->
    <rect x="-46" y="2" width="8" height="28" rx="4" fill="#00f0ff" />
    <rect x="38" y="2" width="8" height="28" rx="4" fill="#00f0ff" />
    <path d="M -42 2 C -42 -40, 42 -40, 42 2" fill="none" stroke="#00f0ff" stroke-width="3" />
  </g>

  <!-- Cyberpunk Top Badge -->
  <g transform="translate(30, 45)">
    <rect width="110" height="22" rx="4" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1" />
    <text x="55" y="15" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">PILOT ID // 09</text>
  </g>
  <g transform="translate(260, 45)">
    <circle cx="8" cy="11" r="4" fill="#10b981" />
    <text x="20" y="15" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">ONLINE</text>
  </g>

  <!-- Cyberpunk Bottom Tag -->
  <g transform="translate(30, 420)">
    <text x="0" y="0" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">SAKTI ARIF D.S.</text>
    <text x="0" y="16" fill="rgba(0, 240, 255, 0.8)" font-family="monospace" font-size="10">FULLSTACK &amp; GAME DEVELOPER</text>
  </g>
</svg>
