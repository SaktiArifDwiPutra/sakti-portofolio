  <text x="162" y="382" fill="#F0F0E9" font-family="sans-serif" font-weight="600" font-size="15">Standard Care — 4.0 kg</text>
  <text x="162" y="406" fill="#A2A8AE" font-family="monospace" font-size="11">STATE: IN_PROGRESS</text>

  <rect x="144" y="438" width="262" height="118" rx="6" fill="#1D2124" stroke="#B8F36B" stroke-opacity="0.4"/>
