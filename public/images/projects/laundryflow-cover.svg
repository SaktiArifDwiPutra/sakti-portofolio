  <text x="162" y="274" fill="#F0F0E9" font-family="sans-serif" font-weight="600" font-size="15">Express Batch — 6.5 kg</text>
  <text x="162" y="298" fill="#A2A8AE" font-family="monospace" font-size="11">SYNCED WITH ODOO PARTNER</text>

