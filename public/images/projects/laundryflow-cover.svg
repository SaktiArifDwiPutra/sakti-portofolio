  <!-- Mobile Device Anatomy Frame (Left/Center) -->
  <rect x="120" y="148" width="310" height="436" rx="16" fill="#171A1D" stroke="#B8F36B" stroke-width="1.5"/>
  <line x1="120" y1="202" x2="430" y2="202" stroke="#F0F0E9" stroke-opacity="0.12"/>
  <text x="148" y="180" fill="#B8F36B" font-family="monospace" font-size="11">FLUTTER CLIENT // ORDER QUEUE</text>

  <!-- Mobile Cards -->
  <rect x="144" y="222" width="262" height="92" rx="6" fill="#1D2124" stroke="#F0F0E9" stroke-opacity="0.16"/>
