  <line x1="576" y1="212" x2="1052" y2="212" stroke="#F0F0E9" stroke-opacity="0.1"/>

  <rect x="576" y="240" width="224" height="140" fill="#1D2124" stroke="#F0F0E9" stroke-opacity="0.14"/>
  <text x="598" y="272" fill="#B8F36B" font-family="monospace" font-size="11">MODEL: laundry.order</text>
  <text x="598" y="302" fill="#F0F0E9" font-family="monospace" font-size="12">• partner_id (Customer)</text>
  <text x="598" y="326" fill="#F0F0E9" font-family="monospace" font-size="12">• state (Workflow Stage)</text>
  <text x="598" y="350" fill="#F0F0E9" font-family="monospace" font-size="12">• service_line_ids</text>

  <rect x="828" y="240" width="224" height="140" fill="#1D2124" stroke="#F0F0E9" stroke-opacity="0.14"/>
  <text x="850" y="272" fill="#E5A93C" font-family="monospace" font-size="11">MODEL: res.partner</text>
  <text x="850" y="302" fill="#F0F0E9" font-family="monospace" font-size="12">• customer_profile</text>
  <text x="850" y="326" fill="#F0F0E9" font-family="monospace" font-size="12">• order_history_count</text>
  <text x="850" y="350" fill="#F0F0E9" font-family="monospace" font-size="12">• contact_channel</text>

  <rect x="576" y="406" width="476" height="142" fill="#1D2124" stroke="#F0F0E9" stroke-opacity="0.14"/>
  <text x="598" y="438" fill="#A2A8AE" font-family="monospace" font-size="11">WORKFLOW STATE PIPELINE</text>
  <text x="598" y="478" fill="#F0F0E9" font-family="monospace" font-size="14">[RECEIVED] ──► [WASHING] ──► [IRONING] ──► [READY] ──► [DONE]</text>
  <text x="598" y="516" fill="#B8F36B" font-family="monospace" font-size="11">REAL-TIME STATE PERSISTENCE BETWEEN MOBILE OPERATOR &amp; ODOO CORE</text>
