    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="380" y1="0" x2="380" y2="675"/>
    <line x1="820" y1="0" x2="820" y2="675"/>
  </g>
  <rect x="64" y="56" width="1072" height="563" stroke="#F0F0E9" stroke-opacity="0.18" stroke-width="1.5"/>
  <line x1="64" y1="112" x2="1136" y2="112" stroke="#F0F0E9" stroke-opacity="0.16"/>
  <rect x="92" y="76" width="10" height="10" fill="#B8F36B"/>
  <text x="116" y="86" fill="#F0F0E9" font-family="monospace" font-size="13" letter-spacing="2">LAUNDRYFLOW // FLUTTER MOBILE + ODOO ERP INTEGRATION</text>
