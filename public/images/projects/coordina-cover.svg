<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040910" />
      <stop offset="50%" stop-color="#07131e" />
      <stop offset="100%" stop-color="#0a1a1c" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg2)" />
  <rect width="1200" height="750" fill="url(#grid2)" />

  <circle cx="950" cy="220" r="260" fill="#00f2fe" opacity="0.08" filter="blur(70px)" />
  <circle cx="250" cy="520" r="240" fill="#10b981" opacity="0.07" filter="blur(60px)" />

  <!-- Outer Frame -->
  <rect x="40" y="40" width="1120" height="670" rx="20" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />
  
  <path d="M 35 70 L 35 35 L 70 35" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 1165 70 L 1165 35 L 1130 35" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 35 680 L 35 715 L 70 715" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 1165 680 L 1165 715 L 1130 715" fill="none" stroke="#00f2fe" stroke-width="3" />

  <!-- Header HUD Tag -->
  <rect x="80" y="80" width="340" height="34" rx="8" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.3)" />
  <circle cx="102" cy="97" r="4" fill="#10b981" />
  <text x="118" y="102" font-family="monospace" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="2">SPEC // REAL-TIME EVENT ENGINE</text>

  <!-- Big Title -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1">Coordina</text>
  <text x="80" y="255" font-family="monospace" font-size="16" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">LARAVEL • WEBSOCKETS • PUSHER • LARAVEL ECHO • VITE • TAILWIND CSS</text>

  <!-- Real-time Event Signal Visual -->
  <g transform="translate(80, 310)">
    <!-- Main Orchestration Node -->
    <rect x="0" y="0" width="460" height="200" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" />
    <text x="28" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#10b981">EVENT DISPATCHER // LARAVEL CORE</text>
    <text x="28" y="82" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Real-Time Coordination</text>
    <text x="28" y="116" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">• Broadcast Event Channels &amp; Task Queues</text>
    <text x="28" y="140" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">• Presence &amp; Private Authenticated Sockets</text>
    <text x="28" y="164" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">• Instant State Reconciliation across clients</text>

    <!-- Signal Animation Waveforms -->
    <path d="M 460 100 Q 520 40 580 100 T 700 100" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="8,4" />
    <circle cx="580" cy="100" r="6" fill="#10b981" />

    <!-- Connected Subscribers Node -->
    <rect x="700" y="0" width="340" height="200" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5" />
    <text x="724" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#00f2fe">CLIENT SUBSCRIBERS</text>
    <text x="724" y="82" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Laravel Echo + Pusher</text>
    <text x="724" y="116" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">Zero-latency DOM synchronization</text>
    <text x="724" y="140" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">Mobile &amp; desktop synchronized UI</text>
    <rect x="724" y="156" width="120" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)" />
    <text x="734" y="171" font-family="monospace" font-size="10" fill="#10b981" font-weight="700">STATUS: LIVE STREAM</text>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 640)">
    <circle cx="10" cy="10" r="5" fill="#10b981" />
    <text x="26" y="14" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.7)">COLLABORATIVE EVENT HUB • WEBSOCKET CHANNELS • REACTIVE LARAVEL BACKBONE</text>
  </g>
</svg>

