<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="50%" stop-color="#08141d" />
      <stop offset="100%" stop-color="#061214" />
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(45, 212, 191, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg3)" />
  <rect width="1200" height="750" fill="url(#grid3)" />

  <circle cx="280" cy="240" r="240" fill="#2dd4bf" opacity="0.08" filter="blur(65px)" />
  <circle cx="960" cy="500" r="240" fill="#38bdf8" opacity="0.07" filter="blur(65px)" />

  <!-- Outer Frame -->
  <rect x="40" y="40" width="1120" height="670" rx="20" fill="none" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1.5" />
  
  <path d="M 35 70 L 35 35 L 70 35" fill="none" stroke="#2dd4bf" stroke-width="3" />
  <path d="M 1165 70 L 1165 35 L 1130 35" fill="none" stroke="#2dd4bf" stroke-width="3" />
  <path d="M 35 680 L 35 715 L 70 715" fill="none" stroke="#2dd4bf" stroke-width="3" />
  <path d="M 1165 680 L 1165 715 L 1130 715" fill="none" stroke="#2dd4bf" stroke-width="3" />

  <!-- Header HUD Tag -->
  <rect x="80" y="80" width="370" height="34" rx="8" fill="rgba(45, 212, 191, 0.08)" stroke="rgba(45, 212, 191, 0.3)" />
  <circle cx="102" cy="97" r="4" fill="#2dd4bf" />
  <text x="118" y="102" font-family="monospace" font-size="12" font-weight="700" fill="#2dd4bf" letter-spacing="2">SPEC // PHARMACY POS &amp; INVENTORY</text>

  <!-- Big Title -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1">Obathaus</text>
  <text x="80" y="255" font-family="monospace" font-size="16" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">LARAVEL • INERTIA.JS • VUE 3 • TAILWIND CSS • MYSQL</text>

  <!-- Architecture Visual -->
  <g transform="translate(80, 310)">
    <!-- Inertia + Vue3 SPA Card -->
    <rect x="0" y="0" width="460" height="200" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1.5" />
    <text x="28" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#2dd4bf">CLIENT SPA // INERTIA.JS + VUE 3</text>
    <text x="28" y="82" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Pharmacy Cashier &amp; Stock</text>
    <text x="28" y="116" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">• Instant Point-of-Sale checkout interface</text>
    <text x="28" y="140" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">• Real-time stock alerts &amp; batch expiry audit</text>
    <text x="28" y="164" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">• Seamless monolithic SPA without client routing lag</text>

    <!-- Connector -->
    <path d="M 460 100 L 580 100" stroke="rgba(45, 212, 191, 0.5)" stroke-width="2" stroke-dasharray="6,4" />
    <polygon points="575,96 585,100 575,104" fill="#2dd4bf" />

    <!-- Laravel Backend Card -->
    <rect x="580" y="0" width="460" height="200" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <text x="608" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">DOMAIN CORE // LARAVEL BACKEND</text>
    <text x="608" y="82" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Relational Inventory Engine</text>
    <text x="608" y="116" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">• ACID transaction safety on medicine stock</text>
    <text x="608" y="140" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.65)">• Role-based access control for pharmacists</text>
    <rect x="608" y="156" width="130" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)" />
    <text x="618" y="171" font-family="monospace" font-size="10" fill="#38bdf8" font-weight="700">INERTIA PROTOCOL</text>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 640)">
    <circle cx="10" cy="10" r="5" fill="#2dd4bf" />
    <text x="26" y="14" font-family="monospace" font-size="13" fill="rgba(255, 255, 255, 0.7)">PHARMACEUTICAL INVENTORY • VUE 3 REACTIVITY • INERTIA.JS HYBRID STACK</text>
  </g>
</svg>

